[package]
name = "threadsafe_zmq"
version = "2.0.0"
edition = "2021"
authors = ["Elvis Sabanovic <elvissabanovic3@gmail.com>"]
description = "Thread-safe ZeroMQ wrapper with sync and async support"
readme = "README.md"
keywords = ["threadsafe", "zeromq", "sockets", "async", "channels"]
categories = ["concurrency", "asynchronous", "network-programming"]
repository = "https://github.com/Elvis339/threadsafe_zmq"
license = "Apache-2.0"
rust-version = "1.70"

[features]
default = []
async = ["tokio"]
bench = ["clap"]

[dependencies]
zmq = "0.10.0"
crossbeam-channel = "0.5.13"
tokio = { version = "1.40", features = ["sync", "rt", "rt-multi-thread", "time"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]
tokio = { version = "1.40", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["bench"]
